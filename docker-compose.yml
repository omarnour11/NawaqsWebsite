services:
  nawaqss-wishlist:
    build: .
    container_name: nawaqss-wishlist
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - API_TOKEN=${API_TOKEN}
    volumes:
      # Persist CSV and JSON leads files on the host machine
      - ./wishlist_leads.csv:/app/wishlist_leads.csv
      - ./wishlist_leads.json:/app/wishlist_leads.json
